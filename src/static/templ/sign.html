<style>
h3{color:#fcfaf2}
#intro{height:691px;background-image:url('{{ url("/src/img/signin.png") }}');background-size:contain;background-repeat:no-repeat}
#signin{margin-top:64px}
#signup{margin-top:64px}
#warning{display:none}#warning img{width:80%;height:auto;margin:0 auto 0 auto}
#warning div.text{margin-top:16px;margin-left:108px}#warning div.text span{color:#ed784a}
</style>

<script id="signjs" type="text/javascript">
    function init() {
        $('#warning button.confirm').on('click', function(e) {
            $('#intro').show();
            $('#signin').hide();
            $('#signup').show();
            $('#warning').hide();
        });

        $('#warning button.cancel').on('click', function(e) {
            $('#intro').show();
            $('#signin').show();
            $('#warning').hide();
        });

        $('#signin button.signup').on('click', function(e) {
            $('#intro').hide();
            $('#signin').hide();

            $('#warning').show();
        });

        $('#signin').find('button.submit').on('click', function(e) {
            let j_signin = $('#signin');
            let mail = j_signin.find('input.mail').val();
            let pw = j_signin.find('input.pw').val();

            $.post(`{{ url('/be/sign') }}`, {
                'reqtype': 'signin',
                'mail': mail,
                'pw': pw,
            }, function(res) {
                res = JSON.parse(res);
                if (res.status == 'S') {
                    $('#signin div.print').print('Success, reloading...', true);

                    if (index.prev_url == null) {
                        location.href = `{{ url('/info/') }}`;
                        return;
                    }
                    location.href = index.prev_url;
                } else {
                    $('#signin div.print').print('Login failed');
                }
            });
        });

        $("#togglePasswordVisible").on('click', function(e) {
            e.preventDefault();
            let password = $("#signin").find('input.pw');
            let eye_open = document.getElementById("eyeOpen");
            let eye_close = document.getElementById("eyeClose");

            if (password.attr('type') === 'password') {
                password.attr('type', 'text');
                eye_open.style.display = 'none';
                eye_close.style.display = 'block';

            } else {
                password.attr('type', 'password');
                eye_open.style.display = 'block';
                eye_close.style.display = 'none';
            }
        });

        $('#signup').find('button.submit').on('click', function(e) {
            let j_signup = $('#signup');
            let name = j_signup.find('input.name').val();
            let mail = j_signup.find('input.mail').val();
            let pw = j_signup.find('input.pw').val();
            let repeat = j_signup.find('input.repeat').val();

            if(pw != repeat) {
                index.show_notify_dialog('Repeat password incorrect', index.DIALOG_TYPE.warning);
                return;
            }

            $.post(`{{ url('/be/sign') }}`, {
                'reqtype': 'signup',
                'mail': mail,
                'pw': pw,
                'name': name,
            }, function(res) {
                res = JSON.parse(res);
                if (res.status == 'S') {
                    index.show_notify_dialog('Success, reloading...', index.DIALOG_TYPE.success);
                    if (index.prev_url == null) {
                        location.href = `{{ url('/info/') }}`;
                        return;
                    }
                    location.href = index.prev_url;
                } else {
                    index.show_notify_dialog(res.data, index.DIALOG_TYPE.error);
                }
            });
        });

        $('#signup button.cancel').on('click', function(e) {
            index.reload();
        });
    }
</script>

                    </button>
                </div>
            </div>

            <button class="btn btn-success submit" tabindex=3 type="button">Login</button>

            <div class="print"></div>
            <div style="margin-top:64px;">
                <label class="form-label">Register</label>
                <br>
                <button class="btn btn-primary signup" tabindex=8 type="button">Register</button>
            </div>
        </form>

        <form id="signup" style="display:none;">
            <h3>Register</h3>
            <input class="name form-control" type="text" tabindex=4 placeholder="name">
            <input class="mail form-control" type="text" tabindex=5 placeholder="mail">
            <input class="pw form-control" type="password" tabindex=6 placeholder="password">
            <input class="repeat form-control" type="password" tabindex=7 placeholder="repeat">

            <div class="mb-1">
                <button class="btn btn-primary submit" tabindex=8 type="button">Register</button>
                <button class="btn btn-secondary cancel" type="button">Cancel</button>
            </div>
        </form>
    </div>
    <div id="warning" class="g-lg-6 g-off-lg-3">
        <img src="{{ url('/src/img/warning2.png') }}" style="width: 40vw;"><img>
        <div class="text">
        <span>你想不想要養我.....QAQ...??</span><br><br>
            <button class="btn btn-success confirm" style="margin-left:48px;">是</button>
