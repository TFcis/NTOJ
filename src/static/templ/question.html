<script type="text/javascript">
    function init() {
        let j_form = $('#form');
        let acct_id = "{{ user.acct_id }}";
        j_form.find('button.submit').on('click', function(e) {
            let qtext = j_form.find('textarea.ques').val();
            $.post(`{{ url('/be/question') }}`, {
            'reqtype': 'ask',
            'acct_id': acct_id,
            'qtext': qtext,
            }, function(res) {
                res = JSON.parse(res);
                if (res.status == 'S') {
                    index.show_notify_dialog('Done', index.DIALOG_TYPE.success);
                    setTimeout(() => index.reload(), 1000);
                } else {
                    index.show_notify_dialog(res.data, index.DIALOG_TYPE.error);
                }
            });
        });
    }

    function rm_ques(idx) {
        let j_form = $('#form');
        let acct_id = "{{ user.acct_id }}"

        $.post(`{{ url('/be/question') }}`, {
            'reqtype': 'rm_ques',
            'acct_id': acct_id,
            'index': idx,
        }, function(res) {
            res = JSON.parse(res);
            if (res.status == 'S') {
                index.show_notify_dialog('Done', index.DIALOG_TYPE.success);
                setTimeout(() => index.reload(), 1000);
            } else {
                index.show_notify_dialog(res.data, index.DIALOG_TYPE.error);
            }
        });
    }
</script>
<div class="g-lg-12">
  <div>
  Username : {{ user.name }}
  <br />
  ID : {{ user.acct_id }}
  </div>
  <div id="form">
    {% for count, ques in enumerate(ques_list) %}
    <div class="p-2 my-2" style="border: 1px solid grey;">
      <h3>Question: </h3>
      <h5>{{ ques['Q'] }}</h5>

      <h3>Reply:</h3>
      {% if ques['A'] == None %}
        <p class="mb-2" style="color:red;">Wait for Reply</p>
      {% else %}
        <h5 class="mb-3">{{ ques['A'] }}</h5>
      {% end %}

      <input type="button" id="buttom" value="Remove" onclick="rm_ques({{ count }});">
    </div>
    {% end %}
    <textarea class="ques my-3 w-100" rows="20"></textarea>
    <button class="btn btn-success submit">Ask</button>
  </div>
</div>
