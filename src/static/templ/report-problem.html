<link rel="stylesheet" type="text/css" href="{{ url('/src/submit.css') }}">

<script type="text/javascript">
    function init() {
        var j_submit = $('#submit');

        j_submit.find('button.submit').on('click', function(e) {
            let info = j_submit.find('textarea.info').val();
            let chal_id = "{{ chal_id }}";
            let acct_id = "{{ user.acct_id }}";

            $.post(`{{ url('/be/question') }}`, {
                'reqtype': 'ask',
                'acct_id': acct_id,
                'qtext':
                `
                題目問題回報
                chal_id: ${chal_id}
                其他資訊: ${info}
                `,
            }, function(res) {
                res = JSON.parse(res);
                if (res.status == 'S') {
                    index.show_notify_dialog('Report Successfully', index.DIALOG_TYPE.success);
                    setTimeout(() => index.go(`{{ url('/info/') }}`), 2000);
                } else {
                    index.show_notify_dialog(res.data, index.DIALOG_TYPE.error);
                }
            });
        });

        j_submit.find('button.cancel').on('click', function(e) {
            if (index.prev_url == null) {
                location.href = `{{ url('/info/') }}`;
                return;
            }
            location.href = index.prev_url;
        })
    }
</script>

<div id="submit" class="g-lg-8 g-off-lg-2 blk-cont">
    <h1>Problem Report</h1>
    <p>Please provide any additional information that may help us. Thank you.</p>

    <textarea class="info mb-3 w-100" rows="20" placeholder="Info"></textarea>
    <button class="btn btn-warning submit">Report</button>
    <button class="btn btn-secondary cancel">Cancel</button>
</div>
