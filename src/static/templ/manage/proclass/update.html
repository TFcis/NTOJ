{% extends '../manage.html' %}
{% block head %}

<script type="text/javascript">
    function init() {
        let j_form = $("#form");
        let re = /^(\d+(-\d+)?)(\s*,\s*\d+(-\d+)?)*$/;

        j_form.find("#desc").val(index.unescape_html(`{{ markdown_escape(proclass['desc']) }}`));

        let desc_textarea = document.getElementById('desc');
        let desc_preview = document.getElementById('descPreviewDialog');
        let desc_preview_modal = new bootstrap.Modal(desc_preview);
        desc_textarea.style.height = 'auto';
        desc_textarea.style.height = desc_textarea.scrollHeight + 'px';
        desc_textarea.addEventListener('input', (event) => {
            const newHeight = desc_textarea.scrollHeight;
            if (newHeight > desc_textarea.offsetHeight) {
                desc_textarea.style.height = newHeight + 'px';
            }
        });

        j_form.find('#preview').on('click', function(e) {
            let body = desc_preview.querySelector('.modal-body');
            body.innerHTML = DOMPurify.sanitize(marked.parse(desc_textarea.value));
            try {
                MathJax.typeset();
            } catch (e) {
                console.warn('MathJax typeset error', e);
            }
            desc_preview_modal.show();
        });

        j_form.find("#update").on('click', (event) => {
            let name = j_form.find("#name").val();
            let list = j_form.find("#list").val();
            let proclass_type = j_form.find("#type").val();

            if (!re.test(list)) {
                index.show_notify_dialog("Problem List錯誤，請輸入數字、逗號、減號與空白做設定，範例：1, 2, 3, 5-7", index.DIALOG_TYPE.warning);
                return;
            }

            $.post(`{{ url('/be/manage/proclass/update') }}`, {
                reqtype: 'update',
                proclass_id: "{{ proclass_id }}",
                name: name,
                list: list,
                desc: desc_textarea.value,
                type: proclass_type,
            }, function(res) {
                res = JSON.parse(res);
                if (res.status == 'S') {
                    index.show_notify_dialog('Update Successfully', index.DIALOG_TYPE.success);
                    index.reload();
                } else {
                    index.show_notify_dialog(res.data, index.DIALOG_TYPE.error);
                }
            });
        });

        j_form.find("#remove").on('click', (event) => {
            if (!confirm('Are you sure to remove this problem class?')) {
                return;
            }
            $.post(`{{ url('/be/manage/proclass/update') }}`, {
                reqtype: 'remove',
                proclass_id: "{{ proclass_id }}"
            }, function(res) {
                res = JSON.parse(res);
                if (res.status == 'S') {
                    index.show_notify_dialog('Remove Successfully', index.DIALOG_TYPE.success);
                    index.go(`{{ url('/manage/proclass/') }}`);
                } else {
                    index.show_notify_dialog(res.data, index.DIALOG_TYPE.error);
                }
            });
        });

        j_form.find("#cancel").on('click', (event) => {
            index.go(`{{ url('/manage/proclass/') }}`)
        });
    }
</script>
{% end %}
{% block content %}
{% from services.pro import ProClassConst %}
{% from utils.numeric import merge_list_to_str %}

<div class="modal fade" id="descPreviewDialog" tabindex="-1" aria-hidden="true">
<div class="modal-dialog modal-dialog-scrollable modal-xl">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Preview Markdown Render</h2>
        </div>
        <div class="modal-body">
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
    </div>
</div>
</div>

<div class="col-lg-10 ms-lg-2 mt-lg-2">
    <form id="form">
        <div class="mb-1">
            <label for="name" class="form-label">Name</label>
            <input class="form-control" id="name" type="text" value="{{ proclass['name'] }}">
        </div>

        <div class="mb-1">
            <label for="name" class="form-label">ProClass Type</label>
            <select class="form-select" id="type">
                <option value="{{ ProClassConst.OFFICIAL_PUBLIC }}" {% if proclass['type'] == ProClassConst.OFFICIAL_PUBLIC %} selected {% end %}>Public</option>
                <option value="{{ ProClassConst.OFFICIAL_HIDDEN }}" {% if proclass['type'] == ProClassConst.OFFICIAL_HIDDEN %} selected {% end %}>Hidden</option>
            </select>
        </div>

        <div class="mb-1">
            <label>Problem List</label>
            <input class="form-control" id="list" type="text" value="{{ merge_list_to_str(proclass['list']) }}">
        </div>

        <div class="mb-1">
            <label>Description</label>
            <textarea class="form-control" id="desc"></textarea>
        </div>

        <div class="mt-2">
            <button type="button" class="btn btn-primary" id="update">Update</button>
            <button type="button" class="btn btn-secondary" id="preview">Preview Description</button>
            <button type="button" class="btn btn-secondary" id="cancel">Cancel</button>
            <button type="button" class="btn btn-danger" id="remove">Remove</button>
        </div>
    </form>
</div>
{% end %}
