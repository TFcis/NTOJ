{% extends 'manage.html' %}
{% block head %}
<style>
    #calendar {
        width: 100%;
        min-height: 600px;
        max-height: 60vw;
        height: 100%;
    }
</style>
<link rel="stylesheet" href="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.css" />
<script src="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.js"></script>
<script type="text/javascript" id="contjs">
    function init() {
        const Calendar = tui.Calendar;
        const calendar = new Calendar('#calendar', {
            defaultView: 'month',
            useCreationPopup: true,
            useDetailPopup: true,
            template: {
                time(event) {
                    return `<span style="color: #f8f8f2;">${event.title}</span>`;
                }
            },
            theme: {
                common: {
                    backgroundColor: '#282a36',
                    dayName: {
                        color: '#f8f8f2',
                    },
                    saturday: {
                        color: '#bd93f9',
                    },
                },
                month: {
                    dayExceptThisMonth: {
                        color: '#6272a4',
                    }
                }
            },
        });

        $('#prev-month').on('click', function() {
            calendar.prev();
            updateMonth();
        });

        $('#next-month').on('click', function() {
            calendar.next();
            updateMonth();
        });
        updateMonth();

        function updateMonth() {
            const date = calendar.getDate();
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            $('#current-month').text(
                `${year}/${month}`
            );

            $.get(`{{ url('/be/manage/holiday') }}`, {
                action: `events`,
                year: year,
                month: month
            }, function(res) {
                res = JSON.parse(res);
                if (res.status == 'S') {
                    calendar.clear();
                    calendar.createEvents(res.data);
                } else {
                    index.show_notify_dialog(res.data, index.DIALOG_TYPE.error);
                }
            });
        }

        $('#current-month').on('click', function(e) {
            const $this = $(this);
            const offset = $this.offset();
            const height = $this.outerHeight();
            $('#month-picker').css({
                top: offset.top + height,
                left: offset.left
            }).show();

            let html = '';
            for(let y = 2022; y <= 2050; y++) {
                html += `<option value="${y}">${y}</option>`;
            }
            $('#picker-year').html(html);

            $('#picker-year').val(calendar.getDate().getFullYear());
            $('#picker-month').val(calendar.getDate().getMonth() + 1);

            e.stopPropagation();
        });

        $('#picker-confirm').on('click', function() {
            const year = parseInt($('#picker-year').val());
            const month = parseInt($('#picker-month').val());
            calendar.setDate(new Date(year, month - 1));
            $('#month-picker').hide();
            updateMonth();
        });

        // click any where to close month picker
        $(document).on('click', function() {
            $('#month-picker').hide();
        });
        $('#month-picker').on('click', function(e) {
            e.stopPropagation();
        });
    }
</script>
{% end %}

{% block content %}
<div class="col-lg-10 ms-lg-2 mt-lg-2">
    <div id="calendar-menu" class="d-flex justify-content-center align-items-center mb-3">
        <button id="prev-month" class="btn btn-primary">&lt;</button>
        <span id="current-month" class="mx-3" style="cursor:pointer"></span>
        <div id="month-picker" style="display:none; position:absolute; z-index:1000; background:#fff; border:1px solid #ccc; padding:10px;">
        <select id="picker-year"></select>
        <span style="color: black;">/</span>
        <select id="picker-month">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
        </select>
        <button id="picker-confirm">Go</button>
        </div>
        <button id="next-month" class="btn btn-primary">&gt;</button>
    </div>
    <div id="calendar"></div>
</div>
{% end %}
